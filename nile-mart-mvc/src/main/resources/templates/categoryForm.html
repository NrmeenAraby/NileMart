
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nile-Mart | Add Category</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin-right: 15px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        form {
            background: white;
            padding: 25px;
            max-width: 500px;
            border: 1px solid #ddd;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            padding: 10px 18px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

<nav>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>Add Category</h1>

<form th:action="@{/categories}" th:object="${category}" method="post">

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}">

        <div class="error" th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}"></div>
    </div>

    <div class="form-group">
        <label for="slug">Slug</label>
        <input type="text" id="slug" th:field="*{slug}">

        <div class="error" th:if="${#fields.hasErrors('slug')}"
             th:errors="*{slug}"></div>
    </div>

    <div class="form-group">
        <label for="parentSlug">Parent</label>
        <select id="parentSlug" th:field="*{parentSlug}">
            <option value="">None (top level)</option>

            <option th:each="parent : ${parentCategories}"
                    th:value="${parent.slug}"
                    th:text="${parent.name}">
            </option>
        </select>

        <div class="error" th:if="${#fields.hasErrors('parentSlug')}"
             th:errors="*{parentSlug}"></div>
    </div>

    <div class="form-group">
        <label for="displayOrder">Display Order</label>
        <input type="number" id="displayOrder" th:field="*{displayOrder}">

        <div class="error" th:if="${#fields.hasErrors('displayOrder')}"
             th:errors="*{displayOrder}"></div>
    </div>

    <button type="submit">Save Category</button>

</form>

</body>
</html>
