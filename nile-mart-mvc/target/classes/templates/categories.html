
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nile-Mart | Categories</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin-right: 15px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

<nav>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>Categories</h1>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Parent</th>
        <th>Display Order</th>
        <th>Active</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="category : ${categories}">
        <td>
            <span th:if="${!#strings.isEmpty(category.parentSlug)}">&#8212; </span>
            <span th:text="${category.name}"></span>
        </td>
        <td th:text="${category.slug}"></td>
        <td>
            <span th:if="${#strings.isEmpty(category.parentSlug)}">&#8212;</span>
            <span th:unless="${#strings.isEmpty(category.parentSlug)}"
                  th:text="${category.parentSlug}"></span>
        </td>        <td th:text="${category.displayOrder}"></td>
        <td th:text="${category.active ? 'Yes' : 'No'}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
