<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Brands | NileMart</title>
</head>
<body>

<nav>
    <a th:href="@{/products}">Products</a> |
    <a th:href="@{/categories}">Categories</a> |
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>Brands</h1>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Active</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="brand : ${availableBrands}">
        <td th:text="${brand.name}"></td>
        <td th:text="${brand.slug}"></td>
        <td th:text="${brand.active ? 'Yes' : 'No'}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
